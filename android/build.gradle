// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0" // AGP 7.4 aapt2 cannot parse android-35 jar; compile stays 34, target is 35 (Play checks target)
        minSdkVersion = 23   // v97: 23 required by react-native-image-crop-picker (student photos)
        compileSdkVersion = 34
        targetSdkVersion = 36  // Play requires 36+ from Nov 2026 (Android 16) - compile stays 34 for AGP 7.4 compat

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
        kotlinVersion = "1.8.22"
        firebaseBomVersion = "32.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
            force "androidx.annotation:annotation-experimental:1.3.0"
            force "androidx.appcompat:appcompat:1.6.1"
            force "androidx.appcompat:appcompat-resources:1.6.1"
            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        }
    }
    afterEvaluate { project ->
        project.tasks.each { task ->
            if (task.name.contains("compile") && task.name.contains("Kotlin")) {
                task.kotlinOptions.jvmTarget = "11"
            }
        }
    }
}
