// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0" // AGP 7.4 aapt2 cannot parse android-35 jar; compile stays 34, target is 35 (Play checks target)
        minSdkVersion = 24   // SDK 24 (Android 7.0+) required by Google Play Automatic Protection
        compileSdkVersion = 34
        targetSdkVersion = 36  // Play requires 36+ from Nov 2026 (Android 16) - compile stays 34 for AGP 7.4 compat

        // NDK r28 with 16 KB memory page size support and modern toolchain.
        ndkVersion = "28.2.13676358"
        kotlinVersion = "1.8.22"
        firebaseBomVersion = "32.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

allprojects {
    repositories {
        maven { url "$rootDir/local-maven" }
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "com.google.android.recaptcha:recaptcha:18.5.1"
            force "com.google.android.play:integrity:1.3.0"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.1"
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
            force "androidx.annotation:annotation-experimental:1.3.0"
            force "androidx.appcompat:appcompat:1.6.1"
            force "androidx.appcompat:appcompat-resources:1.6.1"
            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
        }
        exclude group: 'com.google.android.gms', module: 'play-services-safetynet'
    }
    afterEvaluate { project ->
        project.tasks.each { task ->
            if (task.name.contains("compile") && task.name.contains("Kotlin")) {
                task.kotlinOptions.jvmTarget = "11"
            }
        }
    }
}
