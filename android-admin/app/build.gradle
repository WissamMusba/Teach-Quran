plugins {
    id 'com.android.application'
}

android {
    namespace 'ae.sevendistricts.admin'
    compileSdk 34

    defaultConfig {
        applicationId "ae.sevendistricts.admin"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Restrict strictly to ARM 64-bit to minimize APK footprint
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // Self-signed debug key so user can install immediately
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
